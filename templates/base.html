{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b57">
  <title>{% block title %}当直表作成アプリ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260725-2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'dashboard' %}">
      <span class="hospital-logo small" aria-hidden="true"><i></i></span>
      <span>当直表作成</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
    <nav class="main-nav">
      <a href="{% url 'dashboard' %}">当直表</a>
      <a href="{% url 'staff_list' %}">担当者</a>
    </nav>
  </header>

  <main class="page-shell">
    {% if messages %}
      <div class="messages" aria-live="polite">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/app.js' %}?v=20260725-2"></script>
</body>
</html>
